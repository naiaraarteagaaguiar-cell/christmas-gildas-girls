<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8517f">
  <meta name="description" content="Christmas Gildas Girls: calendario de Adviento para Naiara, Melisa y Alba.">
  <title>Christmas Gildas Girls</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%80%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="cabecera">
    <div class="cabecera__cinta" aria-hidden="true"></div>
    <p class="cabecera__kicker">Calendario de Adviento · diciembre de 2026</p>
    <h1 class="cabecera__titulo">Christmas Gildas Girls</h1>
    <div class="cabecera__polaroid" aria-hidden="true">
      <img src="assets/fotos/trio-espejo.jpg" alt="" width="750" height="1000">
      <span class="cabecera__cinta-foto"></span>
    </div>
    <p class="cuenta" id="cuenta" aria-live="polite"></p>
  </header>

  <main class="contenido">
    <section class="quien" id="quien" aria-label="Tu nombre en este móvil"></section>

    <section aria-labelledby="titulo-calendario">
      <h2 class="seccion-titulo" id="titulo-calendario">Las 24 casillas</h2>
      <p class="seccion-ayuda">Las casillas se abren el día que toca, según la hora de Canarias. Las que ya se abrieron se pueden volver a abrir.</p>
      <div class="calendario" id="calendario"></div>
    </section>
  </main>

  <footer class="pie">
    <p>Hecho con cariño para tres Gildas. Lo que respondéis se queda en vuestro móvil.</p>
  </footer>

  <div class="hoja" id="hoja" hidden>
    <div class="hoja__fondo" data-cerrar></div>
    <article class="hoja__panel" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo" tabindex="-1" id="hoja-panel">
      <header class="hoja__cabecera">
        <p class="hoja__numero" id="hoja-numero"></p>
        <h2 class="hoja__titulo" id="hoja-titulo"></h2>
        <button type="button" class="boton--cerrar" data-cerrar>Cerrar</button>
      </header>
      <div class="hoja__cuerpo" id="hoja-cuerpo"></div>
    </article>
  </div>

  <script src="js/contenido.js"></script>
  <script src="js/prueba.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
